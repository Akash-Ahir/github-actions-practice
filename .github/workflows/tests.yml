name: run test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
     
      - name: check workflow status
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "Tests workflow run - SUCCESSFULL"
          else
            echo "Warning: Test workflow run - FAILED"
            echo "exitting"
            exit 1
          fi
