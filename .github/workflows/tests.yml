name: run test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-lates
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      - name: Check workflow status
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "Workflow passed"
          else
            echo "Workflow failed"
            exit 1
          fi
