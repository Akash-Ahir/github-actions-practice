name: Docker publish

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: code-checkout
        uses: actions/checkout@v4

      - name: build docker image
        working-directory: AI-BankApp
        run: docker build -t ai-bank-app .

      - name: Tag docker images
        run: docker tag ai-bank-app akashahir/ai-bank-app:latest

      - name: list images
        run: docker images
