name: Docker publish

on:
 # push:
 workflow_dispatch:
    branches:
      - main
      - master
      - '**'
  workflow_dispatch:
#running on main branch
jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: akashahir/ai-bank-app

    steps:
      - name: code-checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: build docker image
        working-directory: AI-BankApp
        run: docker build -t ai-bank-app .
      
      - name: Tag docker images
        run: |
          docker tag ai-bank-app $DOCKER_IMAGE:latest
          docker tag ai-bank-app $DOCKER_IMAGE:sha-${{ steps.vars.outputs.SHORT_SHA}}

      - name: list images
        run: docker images

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push docker images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push $DOCKER_IMAGE:latest
          docker push $DOCKER_IMAGE:sha-${{ steps.vars.outputs.SHORT_SHA }}
