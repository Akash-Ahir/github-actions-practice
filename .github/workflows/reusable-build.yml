name: Reusable Build

on:
  workflow_call:
    inputs:
      app_name:
        description: "Name of the application"
        type: string
        required: true
      environment: 
        description: "Env for deployment"
        required: true
        type: string
        default: "staging"

    secrets:
      docker_token:
        required: true

    outputs:
      build_version:
        description: "Version generated by the build"
        value: ${{ jobs.build.outputs.build_version }}
jobs: 
  reusable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check whether docker token exists
        run: |
          if [ -n "${{ secrets.DOCKER_TOKEN}}" ]; then
            echo "The docker token iss set: true"
          else
            echo "The docker token is set: false"
          fi
        
      - name: Show build info
        run: |
          echo "Building ${{ inputs.app_name }} for ${{ inputs.environment }}"

      - name: Generate build version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v1.0-${SHORT_SHA}"
          echo "build_version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Show generated version
        run: echo "Generated build version is ${{ steps.version.outputs.build_version }}"          
