name: Smart Triggers

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'src/**'
      - 'app/**'

jobs:
  run-on-code-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger info
        run: echo "Workflow ran because src/ or app/ changed on an allowed branch."
